#σ0 << Ω <<κ 
#Ω=2π, Τ=π/Ω
#μ< Ω/2, τ<Τ/2=π/Ω
#σt0=1/κ
#Τenv = 1/σ0
#πλατος στην συχνοτητα μετα το stage 1 = σ_eff <σ0 -> 1/σ_eff^2 = 1/σ0^2 + 1/σa^2
#n=κ/Ω , Tenv / T
clean_state:
  sigma_0: 0.4 
  kappa: 20.0

optical_channel_noise:
  mu: 2.35
  tau: 0.19
  sigma_w_noise: 0.5
  sigma_t_noise: 0.1
  #dephasing_factor: 2.4

ancilla_parameters:
  sigma_a_w: 0.35
  sigma_a_t: 0.1
plotting:
  #n_teeth: 50

  w_range_factor: 6.8
  t_range_factor: 10.1
  wigner_factor_t: 4.5
  wigner_factor_w: 4.2
  wigner_factor: 4.5
  resolution_1d: 1500
  wigner_resolution: 220

animation:
  # Frames per second for output GIF
  fps: 15

  # Dots per inch (resolution vs file size: 90 is ~20 MB, 75 is ~12 MB)
  dpi: 90

  # Total frames for one complete QEC loop
  total_frames: 140
